plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'dev.flutter.flutter-gradle-plugin'
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader -> localProperties.load(reader) }
}

def flutterVersionCode = (localProperties.getProperty('flutter.versionCode') ?: '1')
def flutterVersionName = (localProperties.getProperty('flutter.versionName') ?: '1.0')

// Keystore (für Release-Signatur)
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    // MUSS zu Manifest + Kotlin-Paket passen
    namespace "ch.zenyourself.app"

    // sichere Defaults (Flutter verwaltet diese Werte)
    compileSdkVersion flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    defaultConfig {
        // Play-Store Paket-ID
        applicationId "ch.zenyourself.app"

        minSdkVersion flutter.minSdkVersion
        targetSdkVersion flutter.targetSdkVersion

        // Versionen kommen aus local.properties (oder hier überschreiben)
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName

        multiDexEnabled true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release

            // --- R8/ProGuard aktiviert ---
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                          'proguard-rules.pro'
        }

        debug {
            // Debug bleibt ungeschrumpft, für schnelleres Iterieren
            minifyEnabled false
            shrinkResources false
        }
    }
}

flutter {
    source '../..'
}

/**
 * WICHTIG: Legacy Play Core (play:core / core-ktx) global ausschließen,
 * damit keine Transitive alte Artefakte reinziehen.
 */
configurations.configureEach {
    exclude group: 'com.google.android.play', module: 'core'
    exclude group: 'com.google.android.play', module: 'core-ktx'
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22"
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'

    // SDK-34-kompatibles Äquivalent für Deferred Components:
    implementation 'com.google.android.play:feature-delivery:2.1.0'

    // Optional – nur falls genutzt:
    // implementation 'com.google.android.play:review:2.0.1'     // In-App Review
    // implementation 'com.google.android.play:app-update:2.1.0' // In-App Update
}
