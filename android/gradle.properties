# android/gradle.properties — Build Tuning (ZenYourself)

# JVM / Memory (lokal 3–4g ok; CI ggf. höher)
org.gradle.jvmargs=-Xmx4g -Xms1g -Dfile.encoding=UTF-8 -XX:+UseParallelGC

# Gradle Daemon & Performance
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# Config cache: meist ok mit aktuellem Flutter/AGP; bei Problemen auf false setzen
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

# AndroidX / Jetifier
android.useAndroidX=true
android.enableJetifier=true

# Kotlin
kotlin.code.style=official
kotlin.incremental=true
kotlin.incremental.useClasspathSnapshot=true
kotlin.compiler.execution.strategy=daemon
