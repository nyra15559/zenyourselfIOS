            printf '%s\n' '</dict>'
            printf '%s\n' '</plist>'
          } > /tmp/ExportOptions.plist

      - name: Build DIAG IPA (minimal entry)
        script: |
          set -e
          BN="${CM_BUILD_NUMBER:-${BUILD_NUMBER:-$(date +%Y%m%d%H%M)}}"
          flutter build ipa \
            --no-enable-impeller \
            -t lib/diag_entry.dart \
            --release \
            --export-options-plist=/tmp/ExportOptions.plist \
            --build-name=0.0.$BN-diag \
            --build-number=$BN

      - name: Verify IPA artifact
