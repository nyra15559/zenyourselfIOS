workflows:
  ios_release:
    name: iOS Release (Signed + TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - appstore_connect   # siehe CM-Group mit ASC/P12/RSA
      vars:
        BUNDLE_ID: ch.zenyourself.app
    scripts:
      - name: Flutter pub get
        script: flutter pub get

      - name: Verify ASC & cert secrets
        script: |
          set -e
          : "${APP_STORE_CONNECT_ISSUER_ID:?Missing APP_STORE_CONNECT_ISSUER_ID}"
          : "${APP_STORE_CONNECT_KEY_IDENTIFIER:?Missing APP_STORE_CONNECT_KEY_IDENTIFIER}"
          : "${APP_STORE_CONNECT_PRIVATE_KEY:?Missing APP_STORE_CONNECT_PRIVATE_KEY}"
          if [ -n "${CERTIFICATE_PRIVATE_KEY:-}" ]; then
            echo "Using CERTIFICATE_PRIVATE_KEY (RSA PEM)"
          elif [ -n "${IOS_P12_BASE64:-}" ] && [ -n "${IOS_P12_PASSWORD:-}" ]; then
            echo "Using IOS_P12_* (P12)"
          else
            echo "❌ Missing certs"; exit 2
          fi

      - name: Automatic code signing (fetch & apply)
        script: |
          set -e
          keychain initialize
          if [ -n "${CERTIFICATE_PRIVATE_KEY:-}" ]; then
            app-store-connect fetch-signing-files "$BUNDLE_ID" \
              --type IOS_APP_STORE \
              --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
              --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
              --private-key "$APP_STORE_CONNECT_PRIVATE_KEY" \
              --certificate-key "$CERTIFICATE_PRIVATE_KEY" \
              --create --verbose
          else
            echo "$IOS_P12_BASE64" | base64 --decode > /tmp/dist.p12
            KEYCHAIN_PATH="$(security default-keychain -d user | tr -d '"')"
            security import /tmp/dist.p12 -P "$IOS_P12_PASSWORD" -A -k "$KEYCHAIN_PATH"
            app-store-connect fetch-signing-files "$BUNDLE_ID" \
              --type IOS_APP_STORE \
              --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
              --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
              --private-key "$APP_STORE_CONNECT_PRIVATE_KEY" \
              --create --verbose
          fi
          keychain add-certificates
          xcode-project use-profiles --project ios/Runner.xcodeproj

      - name: Debug signing state
        script: |
          set -e
          security find-identity -p codesigning -v || true
          ls -l ~/Library/MobileDevice/Provisioning\ Profiles || true

      - name: Resolve App Store profile for $BUNDLE_ID
        script: |
          set -e
          OUT=/tmp/profile_env; : > "$OUT"; FOUND=0
          for f in ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision; do
            [ -e "$f" ] || continue
            TMP=$(mktemp)
            security cms -D -i "$f" > "$TMP" 2>/dev/null || { rm -f "$TMP"; continue; }
            APPID=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$TMP" 2>/dev/null || echo "")
            BID_SUFFIX="${APPID#*.}"
            HAS_DEV=1; /usr/libexec/PlistBuddy -c 'Print :ProvisionedDevices' "$TMP" >/dev/null 2>&1 || HAS_DEV=0
            GTA=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:get-task-allow' "$TMP" 2>/dev/null || echo "true")
            NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$TMP" 2>/dev/null || echo "")
            UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$TMP" 2>/dev/null || echo "")
            if [ "$BID_SUFFIX" = "$BUNDLE_ID" ] && [ "$HAS_DEV" -eq 0 ] && [ "$GTA" = "false" ]; then
              echo "PROFILE_NAME=\"$NAME\"" >> "$OUT"
              echo "PROFILE_UUID=\"$UUID\"" >> "$OUT"
              echo "✅ Using profile: ${NAME:-$UUID}"
              FOUND=1; rm -f "$TMP"; break
            fi
            rm -f "$TMP"
          done
          [ "$FOUND" -eq 1 ] || { echo "❌ No App Store profile found for $BUNDLE_ID"; exit 70; }

      - name: Create ExportOptions.plist (MANUAL mapping)
        script: |
          set -e
          . /tmp/profile_env
          TEAM_ID="${APPLE_TEAM_ID:-${CM_APPLE_TEAM_ID:-${APP_STORE_CONNECT_TEAM_ID:-}}}"
          {
            printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?>'
            printf '%s\n' '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">'
            printf '%s\n' '<plist version="1.0">'
            printf '%s\n' '<dict>'
            printf '%s\n' '  <key>method</key><string>app-store-connect</string>'
            printf '%s\n' '  <key>signingStyle</key><string>manual</string>'
            printf '%s\n' '  <key>signingCertificate</key><string>Apple Distribution</string>'
            [ -n "$TEAM_ID" ] && printf '  <key>teamID</key><string>%s</string>\n' "$TEAM_ID"
            printf '%s\n' '  <key>provisioningProfiles</key>'
            printf '%s\n' '  <dict>'
            printf '    <key>%s</key><string>%s</string>\n' "$BUNDLE_ID" "${PROFILE_NAME:-$PROFILE_UUID}"
            printf '%s\n' '  </dict>'
            printf '%s\n' '  <key>destination</key><string>export</string>'
            printf '%s\n' '  <key>compileBitcode</key><false/>'
            printf '%s\n' '  <key>stripSwiftSymbols</key><true/>'
            printf '%s\n' '</dict>'
            printf '%s\n' '</plist>'
          } > /tmp/ExportOptions.plist

      - name: Build signed IPA (release)
        script: |
          set -e
          BN="${CM_BUILD_NUMBER:-${BUILD_NUMBER:-$(date +%Y%m%d%H%M)}}"
          flutter build ipa \
            --no-enable-impeller \
            --release \
            --export-options-plist=/tmp/ExportOptions.plist \
            --no-tree-shake-icons \
            --build-name=1.0.$BN \
            --build-number=$BN

      - name: Verify IPA artifact
        script: |
          set -e
          find build -type f -name "*.ipa" -print

      - name: Upload to TestFlight (primary + fallback)
        script: |
          set -e
          IPA_PATH="$(find build -type f -name '*.ipa' | head -n1)"
          [ -n "$IPA_PATH" ] || { echo "❌ No IPA found"; exit 1; }
          if app-store-connect publish \
              --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
              --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
              --private-key "$APP_STORE_CONNECT_PRIVATE_KEY" \
              --path "$IPA_PATH" --verbose; then
            echo "✅ Primary upload OK"
          else
            echo "⚠️ Primary upload failed — trying Fastlane fallback…"
            {
              printf '{\n'
              printf '  "key_id": "%s",\n'   "$APP_STORE_CONNECT_KEY_IDENTIFIER"
              printf '  "issuer_id": "%s",\n' "$APP_STORE_CONNECT_ISSUER_ID"
              printf '  "key": "%s",\n'   "$(printf %s "$APP_STORE_CONNECT_PRIVATE_KEY" | sed ':a;N;$!ba;s/\n/\\n/g')"
              printf '  "in_house": false\n'
              printf '}\n'
            } > /tmp/asc_api_key.json
            fastlane run upload_to_testflight \
              ipa:"$IPA_PATH" \
              api_key_path:/tmp/asc_api_key.json \
              skip_waiting_for_build_processing:true \
              reject_build_waiting_for_review:true || true
          fi

  ios_diag:
    name: iOS DIAG (Hello Screen, same signing)
    instance_type: mac_mini_m2
    max_build_duration: 40
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - appstore_connect
      vars:
        BUNDLE_ID: ch.zenyourself.app
    scripts:
      - name: Flutter pub get
        script: flutter pub get

      - name: Automatic code signing (reuse steps)
        script: |
          set -e
          keychain initialize
          if [ -n "${CERTIFICATE_PRIVATE_KEY:-}" ]; then
            app-store-connect fetch-signing-files "$BUNDLE_ID" \
              --type IOS_APP_STORE \
              --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
              --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
